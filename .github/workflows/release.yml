# Cuts a release when the head commit message carries a version marker:
#
#   VLC Skin Studio 1.0.1 [release] 1.0.1
#
# A push without the marker skips this workflow entirely; the Tests workflow
# builds and tests that push instead, so the same work never runs twice. The
# marker version must equal the version in gradle.properties. The release notes
# list every commit since the previous release tag with links, then the text
# from .github/release-template.md, which carries the funding block. The jar is
# attested so a reader can verify where it was built, then published with a
# SHA-256 checksum file.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  marker:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Look for the marker in the commit subject
        id: check
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          SUBJECT=$(printf '%s' "$MESSAGE" | head -n1)
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$SUBJECT" | grep -Eq '\[release\][[:space:]]*[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No [release] x.y.z marker in the head commit subject; the Tests workflow covers this push."
          fi

  release:
    needs: marker
    if: needs.marker.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Read the release marker
        id: version
        run: |
          PROPERTY_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '[:space:]')
          if [ -z "$PROPERTY_VERSION" ]; then
            echo "::error::gradle.properties has no version."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$PROPERTY_VERSION"
          else
            VERSION=$(git log -1 --pretty=%s | python3 -c "import sys,re;m=re.search(r'\[release\]\s*(\d+\.\d+\.\d+)', sys.stdin.read(), re.I);print(m.group(1) if m else '')")
          fi
          if [ -z "$VERSION" ]; then
            echo "No [release] x.y.z marker in the head commit; this is a normal build."
            exit 0
          fi
          if [ "$VERSION" != "$PROPERTY_VERSION" ]; then
            echo "::error::The commit says [release] $VERSION but gradle.properties says $PROPERTY_VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the release notes
        if: steps.version.outputs.version != ''
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_SLUG: ${{ github.repository }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || true)
          if [ -z "$PREVIOUS" ]; then
            RANGE="HEAD"
            PREVIOUS_LABEL="the beginning"
            COMPARE="[${{ steps.version.outputs.version }}]($REPO_URL/commits/${{ steps.version.outputs.version }})"
          else
            RANGE="$PREVIOUS..HEAD"
            PREVIOUS_LABEL="$PREVIOUS"
            COMPARE="[$PREVIOUS...${{ steps.version.outputs.version }}]($REPO_URL/compare/$PREVIOUS...${{ steps.version.outputs.version }})"
          fi
          git log $RANGE --pretty=format:'- %s' > /tmp/changes.txt
          git log $RANGE --pretty=format:"- [%h]($REPO_URL/commit/%H) %s (%an)" > /tmp/commits.txt
          VERSION="${{ steps.version.outputs.version }}" PREVIOUS_LABEL="$PREVIOUS_LABEL" COMPARE="$COMPARE" python3 - <<'PY'
          import os
          template = open(".github/release-template.md", encoding="utf-8").read()
          changes = open("/tmp/changes.txt", encoding="utf-8").read().strip() or "- No changes since the previous release."
          commits = open("/tmp/commits.txt", encoding="utf-8").read().strip() or "- No commits."
          if os.environ.get("PRIVATE_REPO", "").lower() == "true":
              attestation = ("Artifact attestation is not available for user-owned private "
                             "repositories. The jar and its SHA-256 checksum file are still "
                             "built and published by CI from this commit.")
          else:
              attestation = (
                  "Release assets are built and attested by GitHub Actions. Verify the "
                  "downloaded\n`vlc-skin-studio.jar` with:\n\n"
                  "```bash\ngh attestation verify vlc-skin-studio.jar --repo "
                  + os.environ["REPO_SLUG"] + "\n```"
              )
          body = (
              template.replace("{{VERSION}}", os.environ["VERSION"])
              .replace("{{PREVIOUS}}", os.environ["PREVIOUS_LABEL"])
              .replace("{{CHANGES}}", changes)
              .replace("{{COMMITS}}", commits)
              .replace("{{COMPARE}}", os.environ["COMPARE"])
              .replace("{{ATTESTATION}}", attestation)
          )
          open("/tmp/release-body.md", "w", encoding="utf-8").write(body)
          PY
          echo "notes written for ${{ steps.version.outputs.version }}"

      - name: Write the checksum file
        if: steps.version.outputs.version != ''
        run: |
          cd build/libs
          sha256sum vlc-skin-studio.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        if: steps.version.outputs.version != '' && github.event.repository.private != true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/libs/vlc-skin-studio.jar

      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TITLE="VLC Skin Studio $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$TITLE" --notes-file /tmp/release-body.md
            gh release upload "$VERSION" build/libs/vlc-skin-studio.jar build/libs/SHA256SUMS --clobber
          else
            gh release create "$VERSION" --title "$TITLE" --notes-file /tmp/release-body.md --target "${{ github.sha }}" build/libs/vlc-skin-studio.jar build/libs/SHA256SUMS
          fi
          echo "Released $VERSION."
