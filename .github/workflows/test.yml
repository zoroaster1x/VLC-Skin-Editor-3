name: Tests

# Runs when the code or the build changes, and the commit is not a release:
# a push carrying the [release] marker is built and tested by the Release
# workflow instead, so the same suite never runs twice for one commit. A commit
# that only touches the README does not need a build at all. workflow_dispatch
# keeps a manual run possible.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  marker:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Look for the marker in the commit subject
        id: check
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          SUBJECT=$(printf '%s' "$MESSAGE" | head -n1)
          if [ "$EVENT" = "push" ] && printf '%s' "$SUBJECT" | grep -Eq '\[release\][[:space:]]*[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "The head commit is a release; the Release workflow builds and tests it."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: marker
    if: needs.marker.outputs.release == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
