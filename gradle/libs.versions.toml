[versions]
java = "25"
flatlaf = "3.7.2"
modernDocking = "1.4.9"
jackson = "2.22.3"
picocli = "4.7.7"
lombok = "1.18.48"
junit = "6.1.3"
assertj = "3.27.7"
slf4j = "2.0.20"
logback = "1.5.18"
mcp = "2.0.1"
commonsCompress = "1.28.0"
rsyntax = "4.0.1"
miglayout = "11.4.3"
jline = "4.4.6"
shadow = "9.6.1"

[libraries]
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }
flatlaf-themes = { module = "com.formdev:flatlaf-intellij-themes", version.ref = "flatlaf" }
modern-docking-api = { module = "io.github.andrewauclair:modern-docking-api", version.ref = "modernDocking" }
modern-docking-ui = { module = "io.github.andrewauclair:modern-docking-ui", version.ref = "modernDocking" }
modern-docking-single-app = { module = "io.github.andrewauclair:modern-docking-single-app", version.ref = "modernDocking" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mcp-core = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcp" }
mcp-json-jackson2 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson2", version.ref = "mcp" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
rsyntaxtextarea = { module = "com.fifesoft:rsyntaxtextarea", version.ref = "rsyntax" }
miglayout-swing = { module = "com.miglayout:miglayout-swing", version.ref = "miglayout" }
jline = { module = "org.jline:jline", version.ref = "jline" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
