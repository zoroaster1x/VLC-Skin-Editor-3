plugins {
    id 'java'
    id 'application'
    alias(libs.plugins.shadow)
}

group = 'dev.zoroaster1x'
version = providers.gradleProperty('version').getOrElse('1.0.0')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}

// The jar entry point is a separate source set compiled for Java 8, so an old
// JVM can load it and show install instructions instead of failing to start.
sourceSets {
    launcher {
        java.srcDir 'src/launcher/java'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = name == 'compileLauncherJava' ? 8 : 25
    // JDK 23 and newer no longer run annotation processors unless asked to.
    // Lombok generates every model accessor, so this is required.
    options.compilerArgs.add('-proc:full')
}

// gradle.properties is the single source of the version: Version.java reads the
// expanded resource, and the release workflow compares the commit marker with
// the same property. The value is captured here so the configuration cache can
// serialize the task without reaching back into the project.
def appVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('appVersion', appVersion)
    filesMatching('dev/zoroaster1x/vlcskin/version.properties') {
        expand(version: appVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The UI suite paints offscreen through HeadlessStudio; forcing headless
    // makes a local run match CI, where there is no display at all.
    systemProperty 'java.awt.headless', 'true'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

dependencies {
    implementation libs.flatlaf
    implementation libs.flatlaf.extras
    implementation libs.flatlaf.themes
    implementation libs.modern.docking.api
    implementation libs.modern.docking.ui
    implementation libs.modern.docking.single.app
    implementation libs.rsyntaxtextarea
    implementation libs.commonmark
    implementation libs.commonmark.tables
    implementation libs.miglayout.swing

    implementation libs.jackson.databind
    implementation libs.picocli
    implementation libs.mcp.core
    implementation libs.mcp.json.jackson2
    implementation libs.commons.compress
    implementation libs.jline
    implementation libs.slf4j.api
    runtimeOnly libs.logback.classic

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    // Generates the reflection metadata picocli needs inside a GraalVM native image.
    annotationProcessor libs.picocli.codegen

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj
    testRuntimeOnly libs.junit.platform.launcher

    // The Java 8 entry point is plain JDK code; tests exercise its parsing.
    testImplementation sourceSets.launcher.output
}

application {
    mainClass = 'dev.zoroaster1x.vlcskin.launch.Launcher'
    applicationName = 'vlc-skin-studio'
}

tasks.named('jar') {
    from sourceSets.launcher.output
}

tasks.named('shadowJar') {
    archiveBaseName = 'vlc-skin-studio'
    archiveClassifier = ''
    archiveVersion = ''
    from sourceSets.launcher.output
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                   'Enable-Native-Access': 'ALL-UNNAMED'
    }
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

// Writes the runtime classpath to build/runtimecp.txt so scripts and end to end
// checks can run the CLI and MCP server without another launcher.
tasks.register('runtimeClasspathFile') {
    def output = layout.buildDirectory.file('runtimecp.txt')
    def path = sourceSets.main.runtimeClasspath
    outputs.file(output)
    doLast {
        output.get().asFile.text = path.asPath
    }
}

// Regenerates screenshots/ with the headless UI harness: stills and 30fps GIFs.
// Set VELOCITY_THEME to a VeLoCity theme.xml path to also render that fixture.
tasks.register('uiScreenshots', JavaExec) {
    group = 'verification'
    description = 'Regenerate screenshots/ with the headless UI harness.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.zoroaster1x.vlcskin.app.UiShots'
    workingDir = projectDir
    args = [new File(projectDir, 'screenshots').absolutePath, System.getenv('VELOCITY_THEME') ?: '']
    dependsOn testClasses
}
